"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  command = "npm install --no-audit --no-fund && cd upstream && ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm install --ignore-scripts --legacy-peer-deps && npx vite build --outDir ../dist-pwa --emptyOutDir"
  publish = "dist-pwa"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["netease-cloud-music-api-alger"]

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
