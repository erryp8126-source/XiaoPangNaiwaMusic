[build]
  command = "npm ci --no-audit --no-fund && cd upstream && ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci --ignore-scripts --legacy-peer-deps && npx vite build --outDir ../dist-pwa --emptyOutDir"
  publish = "dist-pwa"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["netease-cloud-music-api-alger"]

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
