name: Build & Release Android + iOS + PWA

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '自动上传到指定 GitHub Release 标签（留空则仅生成 Actions 构件）'
        required: false
        default: ''
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: "pages-and-release"
  cancel-in-progress: false

jobs:
  security-tests:
    name: Security & Regression Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install root API dependencies, audit & run security regression tests
        run: |
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          npm --prefix upstream audit --omit=dev --audit-level=high
          npm run test:security

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Ensure Android SDK 35 & Licenses
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          fi

      - name: Build Vue 3 mobile frontend
        working-directory: upstream
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          npm ci --ignore-scripts --legacy-peer-deps
          npx vite build --outDir "${{ github.workspace }}/android/app/src/main/assets/www" --emptyOutDir
          test -f "${{ github.workspace }}/android/app/src/main/assets/www/index.html"

      - name: Decode Android Release Keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "${{ runner.temp }}/xiaopang-release.jks"
            echo "ANDROID_KEYSTORE_PATH=${{ runner.temp }}/xiaopang-release.jks" >> "$GITHUB_ENV"
            ls -lh "${{ runner.temp }}/xiaopang-release.jks"
          else
            echo "No release keystore secret configured; falling back to debug signing"
          fi

      - name: Build Android Release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --no-daemon

      - name: Rename Android APK
        run: |
          VERSION=$(node -p "require('./upstream/package.json').version")
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk "artifacts/XiaoPangNaiwaMusic-v${VERSION}.apk"
          ls -lh "artifacts/XiaoPangNaiwaMusic-v${VERSION}.apk"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: XiaoPangNaiwaMusic-Android-APK
          path: artifacts/XiaoPangNaiwaMusic-*.apk

  build-ios:
    name: Build iOS IPA (Unsigned)
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build Vue 3 mobile frontend into iOS bundle
        working-directory: upstream
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          npm ci --ignore-scripts --legacy-peer-deps
          npx vite build --outDir "${{ github.workspace }}/ios/XiaoPangNaiwaMusic/Resources/www" --emptyOutDir
          test -f "${{ github.workspace }}/ios/XiaoPangNaiwaMusic/Resources/www/index.html"

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build iOS Release App (arm64, unsigned)
        working-directory: ios
        run: |
          xcodebuild \
            -project XiaoPangNaiwaMusic.xcodeproj \
            -scheme XiaoPangNaiwaMusic \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package Unsigned IPA
        working-directory: ios
        run: |
          VERSION=$(node -p "require('../upstream/package.json').version")
          mkdir -p build/Payload ../artifacts
          cp -R build/DerivedData/Build/Products/Release-iphoneos/XiaoPangNaiwaMusic.app build/Payload/
          test -f build/Payload/XiaoPangNaiwaMusic.app/www/index.html
          ls -lh build/Payload/XiaoPangNaiwaMusic.app/www
          cd build
          zip -qry "../../artifacts/XiaoPangNaiwaMusic-v${VERSION}-unsigned.ipa" Payload
          ls -lh "../../artifacts/XiaoPangNaiwaMusic-v${VERSION}-unsigned.ipa"

      - name: Upload iOS IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: XiaoPangNaiwaMusic-iOS-IPA
          path: artifacts/XiaoPangNaiwaMusic-*-unsigned.ipa

  build-pwa:
    name: Build Safari PWA Web Bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build PWA static bundle
        working-directory: upstream
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npm ci --ignore-scripts --legacy-peer-deps
          npx vite build --outDir "${{ github.workspace }}/dist-pwa" --emptyOutDir
          test -f "${{ github.workspace }}/dist-pwa/index.html"
          mkdir -p "${{ github.workspace }}/artifacts"
          cd "${{ github.workspace }}/dist-pwa" && zip -qry "${{ github.workspace }}/artifacts/XiaoPangNaiwaMusic-v${VERSION}-pwa.zip" .
          ls -lh "${{ github.workspace }}/artifacts/XiaoPangNaiwaMusic-v${VERSION}-pwa.zip"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pwa

      - name: Upload PWA bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: XiaoPangNaiwaMusic-Safari-PWA
          path: artifacts/XiaoPangNaiwaMusic-*-pwa.zip

  deploy-pages:
    name: Deploy Safari PWA to GitHub Pages
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [build-pwa]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-verify-netlify:
    name: Deploy & Verify Netlify Health Gate (Optional)
    needs: [security-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to Netlify Production (when configured)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_HEALTH_URL: ${{ vars.NETLIFY_HEALTH_URL || secrets.NETLIFY_HEALTH_URL }}
          COMMIT_REF: ${{ github.sha }}
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ] && [ -n "$NETLIFY_SITE_ID" ]; then
            echo "Building and deploying Netlify production site + functions..."
            npm ci --no-audit --no-fund
            (cd upstream && ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci --ignore-scripts --legacy-peer-deps && npx vite build --outDir ../dist-pwa --emptyOutDir)
            npx --yes netlify-cli deploy --prod --dir=dist-pwa --functions=netlify/functions --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" --message="ci: ${GITHUB_SHA::7}" --json > /tmp/netlify-deploy.json
            if [ -n "$NETLIFY_HEALTH_URL" ]; then
              echo "RESOLVED_NETLIFY_HEALTH_URL=$NETLIFY_HEALTH_URL" >> "$GITHUB_ENV"
            else
              DEPLOYED_SITE_URL=$(node -e "const d = JSON.parse(require('fs').readFileSync('/tmp/netlify-deploy.json','utf8')); console.log(d.url || d.deploy_url || 'https://xiaopang-naiwa-music.netlify.app');")
              echo "RESOLVED_NETLIFY_HEALTH_URL=${DEPLOYED_SITE_URL%/}/api/health" >> "$GITHUB_ENV"
            fi
          elif [ -n "$NETLIFY_HEALTH_URL" ]; then
            echo "NETLIFY_AUTH_TOKEN/NETLIFY_SITE_ID not set; verifying configured NETLIFY_HEALTH_URL..."
            echo "RESOLVED_NETLIFY_HEALTH_URL=$NETLIFY_HEALTH_URL" >> "$GITHUB_ENV"
          else
            echo "Skipping Netlify deploy & health gate: neither NETLIFY_AUTH_TOKEN/NETLIFY_SITE_ID nor NETLIFY_HEALTH_URL is configured."
          fi

      - name: Verify /api/health version & commit gate
        if: env.RESOLVED_NETLIFY_HEALTH_URL != ''
        env:
          NETLIFY_HEALTH_URL: ${{ env.RESOLVED_NETLIFY_HEALTH_URL }}
          APP_API_SECRET: ${{ secrets.APP_API_SECRET }}
        run: |
          EXPECTED_VERSION=$(node -p "require('./package.json').version")
          UPSTREAM_VERSION=$(node -p "require('./upstream/package.json').version")
          if [ "$EXPECTED_VERSION" != "$UPSTREAM_VERSION" ]; then
            echo "Version mismatch between package.json ($EXPECTED_VERSION) and upstream/package.json ($UPSTREAM_VERSION)" >&2
            exit 1
          fi
          EXPECTED_COMMIT="${GITHUB_SHA::7}"
          EXPECTED_VERSION="$EXPECTED_VERSION" EXPECTED_COMMIT="$EXPECTED_COMMIT" node scripts/verify-netlify-health.mjs

  release:
    name: Publish Dual-Platform Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [security-tests, build-android, build-ios, build-pwa, deploy-verify-netlify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Attach assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
          files: |
            release-assets/XiaoPangNaiwaMusic-*.apk
            release-assets/XiaoPangNaiwaMusic-*-unsigned.ipa
            release-assets/XiaoPangNaiwaMusic-*-pwa.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
