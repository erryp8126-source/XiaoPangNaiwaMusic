name: XiaoPangNaiwaMusic
options:
  bundleIdPrefix: com.alger
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: "NO"
    MARKETING_VERSION: "5.1.0"
    CURRENT_PROJECT_VERSION: "51009"

targets:
  XiaoPangNaiwaMusic:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: XiaoPangNaiwaMusic
        excludes:
          - Info.plist
          - Resources/www
          - Resources/www/**
      - path: XiaoPangNaiwaMusic/Resources/www
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alger.musicplayer
        PRODUCT_NAME: XiaoPangNaiwaMusic
        INFOPLIST_FILE: XiaoPangNaiwaMusic/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        DEVELOPMENT_TEAM: ""
